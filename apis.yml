aid: rollstack
name: Rollstack
description: >-
  Rollstack is a business-intelligence reporting automation platform that connects
  live data from BI and analytics tools directly into presentations, documents, and
  emails. It lets teams build recurring QBRs, financial decks, board reports, and client
  scorecards that stay in sync with their underlying data by embedding dashboards and
  visualizations into Google Slides, Google Docs, Microsoft PowerPoint, Microsoft Word,
  and email, then refreshing them on a schedule. Rollstack integrates with Tableau,
  Power BI, Looker, Metabase, Omni, Lightdash, Google Sheets, Microsoft Excel, and
  Snowflake, and distributes the resulting content through Microsoft 365 and Google
  Workspace. Authentication is handled through Auth0 (OpenID Connect) with SAML-based
  single sign-on. Rollstack is backed by Insight Partners.
